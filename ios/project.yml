# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: SaveOurSoul
options:
  bundleIdPrefix: org.saveoursoul
  deploymentTarget:
    iOS: "16.0"
# One Debug/Release pair per environment. Each installs side by side (own bundle id), talks to its
# own backend and uses its own Bluetooth/Nearby namespace. Pick one with the matching scheme.
configs:
  Dev Debug: debug
  Dev Release: release
  Testing Debug: debug
  Testing Release: release
  Prod Debug: debug
  Prod Release: release
packages:
  SOSCore:
    path: SOSCore
  NearbyConnections:
    url: https://github.com/google/nearby
    branch: main  # pin to a release tag/revision before shipping
targets:
  SaveOurSoul:
    type: application
    platform: iOS
    sources: [SaveOurSoul]
    dependencies:
      - package: SOSCore
      - package: NearbyConnections
        product: NearbyConnections
    settings:
      configs:
        Dev Debug: &dev
          SOS_ENV: development
          SOS_BACKEND_URL: https://saveoursoul-api-dev.onrender.com
          SOS_MESH_NAMESPACE: DEV
          SOS_BONJOUR_SERVICE: _eaec558b7a99._tcp
          SOS_DISPLAY_NAME: SOS Dev
          PRODUCT_BUNDLE_IDENTIFIER: org.saveoursoul.ios.dev
        Dev Release: *dev
        Testing Debug: &testing
          SOS_ENV: testing
          SOS_BACKEND_URL: https://saveoursoul-api-testing.onrender.com
          SOS_MESH_NAMESPACE: TESTING
          SOS_BONJOUR_SERVICE: _4fc764215c71._tcp
          SOS_DISPLAY_NAME: SOS Testing
          PRODUCT_BUNDLE_IDENTIFIER: org.saveoursoul.ios.testing
        Testing Release: *testing
        Prod Debug: &prod
          SOS_ENV: production
          SOS_BACKEND_URL: https://saveoursoul-api.onrender.com
          SOS_MESH_NAMESPACE: PRODUCTION
          SOS_BONJOUR_SERVICE: _19e735ef5c3e._tcp
          SOS_DISPLAY_NAME: SaveOurSoul
          PRODUCT_BUNDLE_IDENTIFIER: org.saveoursoul.ios
        Prod Release: *prod
      base:
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: SaveOurSoul/Info.plist
      properties:
        CFBundleDisplayName: $(SOS_DISPLAY_NAME)
        SOSEnvironment: $(SOS_ENV)
        SOSBackendURL: $(SOS_BACKEND_URL)
        SOSMeshNamespace: $(SOS_MESH_NAMESPACE)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Your location is sent with your SOS so responders can find you.
        NSLocationAlwaysAndWhenInUseUsageDescription: While an SOS is active your location keeps updating, even in the background.
        NSBluetoothAlwaysUsageDescription: Bluetooth lets your SOS reach nearby phones when there is no internet, and lets you relay theirs.
        NSLocalNetworkUsageDescription: The local network lets your SOS reach nearby phones when there is no internet.
        # Nearby Connections' Wi-Fi LAN medium advertises a Bonjour service derived from the
        # environment's service id: "_" + first 12 hex chars of SHA-256(service id) + "._tcp".
        NSBonjourServices: [$(SOS_BONJOUR_SERVICE)]
        UIBackgroundModes: [location, bluetooth-central, bluetooth-peripheral, fetch]
        BGTaskSchedulerPermittedIdentifiers: [org.saveoursoul.flush]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  SaveOurSoul:
    build:
      targets:
        SaveOurSoul: all
    run:
      config: Prod Debug
    test:
      config: Prod Debug
    profile:
      config: Prod Release
    analyze:
      config: Prod Debug
    archive:
      config: Prod Release
  SaveOurSoul Testing:
    build:
      targets:
        SaveOurSoul: all
    run:
      config: Testing Debug
    test:
      config: Testing Debug
    profile:
      config: Testing Release
    analyze:
      config: Testing Debug
    archive:
      config: Testing Release
  SaveOurSoul Dev:
    build:
      targets:
        SaveOurSoul: all
    run:
      config: Dev Debug
    test:
      config: Dev Debug
    profile:
      config: Dev Release
    analyze:
      config: Dev Debug
    archive:
      config: Dev Release
