name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Same suite on SQLite (local dev) and PostgreSQL (what Render/Neon run).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:pg
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sos_test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # ubuntu-latest ships an Android SDK and sets ANDROID_HOME, so :app is included.
      # assembleDebug builds the dev, testing and prod variants.
      - run: ./gradlew --no-daemon :core:test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: saveoursoul-debug-apks
          path: android/app/build/outputs/apk/*/debug/*.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core tests (shared protocol vectors)
        working-directory: ios/SOSCore
        run: swift test
      - name: Build app for the simulator
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen
          xcodebuild -project SaveOurSoul.xcodeproj -scheme SaveOurSoul -configuration "Prod Debug" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
